      x-microcks-operation:
        delay: 100
        dispatcher: FALLBACK
        dispatcherRules: UsersMeCalendarListGetResponseExample
    put:
      tags:
      - User Calendars
      summary: Google Update Calendar List
      description: Updates an existing calendar on the user's calendar list.
      operationId: googleUpdatecalendarlist
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: calendarId
        in: path
        schema:
          type: string
        required: true
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersMeCalendarListPutRequest'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMeCalendarListPutResponse'
              examples:
                UsersMeCalendarListPutResponseExample:
                  $ref: '#/components/examples/UsersMeCalendarListPutResponseExample'
      x-microcks-operation:
        delay: 100
        dispatcher: FALLBACK
        dispatcherRules: UsersMeCalendarListPutResponseExample
    patch:
      tags:
      - User Calendars
      summary: Google Patch Calendar List
      description: Updates an existing calendar on the user's calendar list. This method supports patch semantics.
      operationId: googlePatchcalendarlist
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: calendarId
        in: path
        schema:
          type: string
        required: true
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
