      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMeCalendarListPatchResponse'
              examples:
                UsersMeCalendarListPatchResponseExample:
                  $ref: '#/components/examples/UsersMeCalendarListPatchResponseExample'
      x-microcks-operation:
        delay: 100
        dispatcher: FALLBACK
        dispatcherRules: UsersMeCalendarListPatchResponseExample
    delete:
      tags:
      - User Calendars
      summary: Google Remove Calendar On List
      description: Removes a calendar from the user's calendar list.
      operationId: googleRemovecalendaronlist
      parameters:
      - name: calendarId
        in: path
        schema:
          type: string
        required: true
      - in: header
        name: Authorization
        schema:
          type: string
      responses:
        '204':
          description: No Content
          headers:
            Content-Type:
              schema:
                type: string
                example: text/plain
          content:
            text/plain:
              schema:
                type: string
      x-microcks-operation:
        delay: 100
        dispatcher: FALLBACK
        dispatcherRules: SuccessExample
