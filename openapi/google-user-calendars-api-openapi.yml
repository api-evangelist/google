info:
  title: Google Books About User Calendars API
  description: API for retrieving Bookshelf and Volume resources from Google Books
  version: 1.0.0
  contact:
    name: Google Books API
    url: https://developers.google.com/books
servers:
- url: https://www.googleapis.com/books/v1
  description: Google Books API v1
tags:
- name: User Calendars
  description: Operations related to Usersmecalendarlist
paths:
  /users/me/calendarList/{calendarId}:
    get:
      tags:
      - User Calendars
      summary: Google Get Calendar List
      description: Returns a calendar from the user's calendar list.
      operationId: googleGetcalendarlist
      parameters:
      - name: Accept
        in: header
        schema:
          type: string
        example: application/json
      - name: calendarId
        in: path
        schema:
          type: string
        required: true
      - in: header
        name: Authorization
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMeCalendarListGetResponse'
              examples:
                UsersMeCalendarListGetResponseExample:
                  $ref: '#/components/examples/UsersMeCalendarListGetResponseExample'
