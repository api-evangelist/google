      type: object
      example:
        sendAsEmail: ut nulla
        displayName: Excepteur
        replyToAddress: velit id culpa
        signature: officia quis adipisicing
        isPrimary: true
        isDefault: true
        treatAsAlias: false
        smtpMsa:
          host: in elit
          port: -34532702
          username: aliqua laborum aliquip do
          password: tempor dolor velit
          securityMode: securityModeUnspecified
        verificationStatus: pending
    SettingsCseIdentitiesPatchResponseSignAndEncryptKeyPairs:
      description: SettingsCseIdentitiesPatchResponseSignAndEncryptKeyPairs schema
      type: object
      properties:
        signingKeyPairId:
          type: string
        encryptionKeyPairId:
          type: string
  securitySchemes:
