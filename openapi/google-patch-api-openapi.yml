        emailAddress: aliquip quis id
        primaryKeyPairId: in exercitation esse
        signAndEncryptKeyPairs:
          signingKeyPairId: est deserunt
          encryptionKeyPairId: elit nulla esse ut
    SettingsCseIdentitiesPatchResponse:
      description: SettingsCseIdentitiesPatchResponse schema
      type: object
      properties:
        emailAddress:
          type: string
        primaryKeyPairId:
          type: string
        signAndEncryptKeyPairs:
          $ref: '#/components/schemas/SettingsCseIdentitiesPatchResponseSignAndEncryptKeyPairs'
    UsersSettingsSendAsPatchResponse:
      description: UsersSettingsSendAsPatchResponse schema
      type: object
      properties:
        sendAsEmail:
          type: string
