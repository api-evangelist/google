        dispatcherRules: SuccessExample
  /gmail/v1/users/{userId}/settings/filters/{id}:
    delete:
      tags:
      - Deletes
      summary: Google Delete Filters
      description: Immediately and permanently deletes the specified filter.
      parameters:
      - name: userId
        in: path
        schema:
          type: string
        required: true
        description: '(Required) '
        example: incididunt labore i
      - name: id
        in: path
        schema:
