  baseURL: https://api.example.com
  contact:
  - FN: Cloud Gateway Support
    url: https://cloud.google.com/api-gateway/docs/support
    email: ''
  humanURL: https://cloud.google.com/api-gateway/docs
  properties:
  - url: https://cloud.google.com/api-gateway/docs/reference/rest
    type: Documentation
  description: >-
    API Gateway enables you to provide secure access to your backend services through a well-defined REST
    API that is consistent across all of your services, regardless of the service implementation. Clients
