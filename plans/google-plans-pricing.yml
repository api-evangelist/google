rate_limit_statements:
- 4 and 16 MiBps (equivalent to 4 and 16 capacity units) for publish for each partition.
- 4 and 32 MiBps (equivalent to 2 and 16 capacity units) for subscribe for each partition.
- Each partition must have at least 30 GiB of storage capacity.
- A minimum of 1 KB is assessed for each request, independent of the message sizes in the request.
- The number of partitions across all Lite topics in a reservation must be no greater than the number
  of capacity units reserved.
